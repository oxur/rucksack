name: CI/CD

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
  - cron: "20 4 * * *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Install Rust with caching
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # Cache Cargo dependencies and build artifacts for faster builds
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry/index
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry/cache
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-deps-${{ runner.os }}-

    - name: Cache Cargo git dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: cargo-git-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-git-${{ runner.os }}-

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-target-${{ runner.os }}-

    - name: Cache cargo tools
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin
        key: cargo-tools-${{ runner.os }}-outdated
        restore-keys: |
          cargo-tools-${{ runner.os }}-

    # Check for outdated dependencies - FAILS build if updates are available
    - name: Install cargo-outdated
      run: |
        if ! command -v cargo-outdated &> /dev/null; then
          cargo install cargo-outdated --locked
        fi

    - name: Check for outdated dependencies
      run: |
        echo "Checking for outdated compatible dependencies..."
        OUTPUT=$(cargo outdated --root-deps-only)
        echo "$OUTPUT"

        # Check if any dependencies have compatible updates (Compat column != "---")
        # Skip header lines and crate section headers
        if echo "$OUTPUT" | grep -E "^[a-z0-9_-]+\s+" | awk '{print $3}' | grep -v "^---$" | grep -v "^Compat$" | grep -q .; then
          echo ""
          echo "❌ Compatible dependency updates are available! Run 'make deps' locally and commit the updated Cargo.lock"
          exit 1
        else
          echo ""
          echo "✅ All dependencies are up to date (only incompatible major version updates available)"
        fi

    - name: Build
      run: make build
    - name: Lint
      run: make cicd-lint
    - name: Run checks
      run: make check
    - name: Build docs
      run: make docs
    - name: Run rucksack (locally)
      run: ./tests/rucksack_dev.sh
    - name: Install rucksack (crates.io)
      run: cargo install rucksack
    - name: Run rucksack
      run: ./tests/rucksack.sh
    - name: Notify CI/CD Slack Channel
      uses: innocarpe/actions-slack@v1
      with:
        status: ${{ job.status }}
        success_text: '✅ Build for ${{ github.repository }} succeeded! 😄🌈🐴🚢🐿 (commit id: ${{ github.sha }})'
        failure_text: '❌ Build for ${{ github.repository }} failed! 🤬💣🔥🚒 (commit id: ${{ github.sha }})'
        cancelled_text: '🚧 Build for ${{ github.repository }} was cancelled ... 😯🦡 (commit id: ${{ github.sha }})'
      env:
        GITHUB_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        SLACK_WEBHOOK_URL: ${{ secrets.CICD_BOT_WEBHOOK }}
      if: always()
