[package]
name = "rucksack-lib"
description = "The rucksack core library"
version = "0.10.0"
license = "Apache-2.0"
authors = ["Duncan McGreggor <oubiwann@gmail.com>"]
repository = "https://github.com/oxur/rucksack"
documentation = "https://docs.rs/rucksack-lib/"
keywords = ["password-manager", "terminal"]
exclude = ["/.github", ".gitignore"]
edition = "2021"

[lib]
name = "rucksack_lib"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
bincode = "2.0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dirs = "5.0.1"
lipsum = "0.9.1"
log = { version = "0.4", features = ["kv"] }
passwords = "3.1"
path-clean = "1.0.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3.1.1"
unix_mode = "0.1"
uuid = { version = "1.19", features = ["v4"] }
versions = "6.3.2"

[dev-dependencies]
tempfile = "3"
