[package]
name = "rucksack"
description = "A terminal-based secrets manager, generator, and importer/exporter (Firefox, Chrome) backed with a concurrent hashmap"
version = "0.10.0"
license = "Apache-2.0"
authors = ["Duncan McGreggor <oubiwann@gmail.com>"]
repository = "https://github.com/oxur/rucksack"
documentation = "https://docs.rs/rucksack/"
categories = ["command-line-interface"]
keywords = ["password-manager", "terminal"]
exclude = ["/.github", ".gitignore"]
edition = "2021"

[lib]
name = "rucksack"

[dependencies]
actix = "0.13"
anyhow = "1.0"
clap = { version = "4.5", features = ["string", "env"] }
clap_complete = "4.5"
confyg = "0.3"
digest = "0.10.7"
log = { version = "0.4", features = ["kv"] }
passwords = "3.1"
prettytable-rs = "0.10.0"
rpassword = "7.4"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
twyg = "0.6"
versions = "6.3.2"

[dependencies.rucksack-db]
path = "../rucksack-db"
version = "0.11"
features = ["filesystem"]

[dependencies.rucksack-lib]
path = "../rucksack-lib"
version = "0.10"

[[bin]]
name = "rucksack"
